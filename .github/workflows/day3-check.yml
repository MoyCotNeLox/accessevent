name: Day3 Backend Check

'on':
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check project structure
        run: |
          test -f app.py
          test -f config.py
          test -f models.py
          test -f routes/auth.py
          test -f routes/events.py
          test -f routes/registrations.py
          test -f utils/auth_helpers.py

      - name: Check security helpers
        run: |
          grep -q "hash_password" utils/auth_helpers.py
          grep -q "generate_token" utils/auth_helpers.py
          grep -q "role_required" utils/auth_helpers.py

      - name: Check accessibility
        run: grep -q "accessibility" utils/accessibility.py

      - name: Syntax check
        run: python -m py_compile app.py config.py models.py routes/*.py utils/*.py

      - name: Complete check
        run: echo "PASS: Day3 Backend Check completed"